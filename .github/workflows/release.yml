name: release

# Builds the Bootstrapping binaries, checks each one on the kind of machine
# it is for, and publishes them with a release.
#
# Releases go out on their own. When the test workflow passes on a push to
# main and the Version in bootstrapping.go has no tag yet, this workflow
# builds the binaries from that commit, runs scripts/smoke.py on them, then
# tags the commit vX.Y.Z and publishes the release "Bootstrapping vX.Y.Z"
# with the archives and SHA256SUMS attached. Nothing goes public unless every
# build and check passes. scripts/release-plan.py has the rules, and
# RELEASING.md the whole procedure.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build again, such as v0.1.0"
        required: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  BUILD_TAGS: sqlite_omit_load_extension,osusergo,netgo

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: python3 scripts/release-plan.py

  # The SQLite driver is cgo, so each target is built on its own kind of
  # machine and checked there before it is packed. macOS Intel is built on
  # Apple silicon and can only be checked for its architecture.
  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux_amd64, runner: ubuntu-latest, pack: tar, static: true }
          - { name: linux_arm64, runner: ubuntu-24.04-arm, pack: tar, static: true }
          - { name: darwin_arm64, runner: macos-latest, pack: tar }
          - { name: darwin_amd64, runner: macos-latest, pack: tar, cross: amd64 }
          - { name: windows_amd64, runner: windows-latest, pack: zip, static: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.pack == 'zip' && 'msys2 {0}' || 'bash' }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - if: matrix.pack == 'zip'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc zip
          path-type: inherit
      - name: Build
        run: |
          ext=""
          if [ "${{ matrix.pack }}" = zip ]; then ext=".exe"; fi
          ld="-s -w"
          if [ "${{ matrix.static }}" = true ]; then ld="$ld -extldflags \"-static\""; fi
          if [ -n "${{ matrix.cross }}" ]; then
            export GOARCH=${{ matrix.cross }} CC="clang -arch x86_64"
          fi
          mkdir pkg
          for c in bootstrapping bst; do
            go build -trimpath -tags "$BUILD_TAGS" -ldflags "$ld" -o "pkg/$c$ext" "./cmd/$c"
          done
          go build -trimpath -tags "$BUILD_TAGS" -ldflags "$ld" -o "pkg/bootstrapping-demo$ext" ./examples/permissions
          if command -v file > /dev/null; then file pkg/*; else ls -l pkg; fi
          if [ "${{ matrix.static }}" = true ] && [ "$RUNNER_OS" = Linux ]; then
            file pkg/bootstrapping | grep -q 'statically linked'
          fi
      - name: Architecture
        if: matrix.cross != ''
        run: file pkg/bootstrapping | grep -q x86_64
      - name: Smoke check
        if: matrix.cross == ''
        run: |
          PY=python3; if [ "$RUNNER_OS" = Windows ]; then PY=python; fi
          "$PY" -B scripts/smoke.py pkg
      - name: Package
        run: |
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          name=bootstrapping_${{ matrix.name }}
          if [ "${{ matrix.pack }}" = zip ]; then
            (cd pkg && zip -q "../$name.zip" *)
          else
            tar -czf "$name.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrapping_${{ matrix.name }}
          path: bootstrapping_${{ matrix.name }}.*

  release:
    needs: [plan, build]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
      FILES: >-
        bootstrapping_linux_amd64.tar.gz bootstrapping_linux_arm64.tar.gz
        bootstrapping_darwin_arm64.tar.gz bootstrapping_darwin_amd64.tar.gz
        bootstrapping_windows_amd64.zip SHA256SUMS
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bootstrapping_*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum bootstrapping_* > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'NOTES'
          Ready-built Bootstrapping binaries. Each archive holds three commands with the license files and README:

          - `bootstrapping`: plan and apply seed files to a SQLite database, keeping local edits (`-json` for machine-readable output)
          - `bst`: the same command under a shorter name
          - `bootstrapping-demo`: an application's roles and permissions through three seed versions, a conflict and an apply killed halfway, with its own checks

          | System | File |
          |---|---|
          | Linux, x86-64 (static) | bootstrapping_linux_amd64.tar.gz |
          | Linux, ARM64 (static) | bootstrapping_linux_arm64.tar.gz |
          | macOS, Apple silicon | bootstrapping_darwin_arm64.tar.gz |
          | macOS, Intel | bootstrapping_darwin_amd64.tar.gz |
          | Windows, x86-64 | bootstrapping_windows_amd64.zip |

          SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine bootstrapping bst bootstrapping-demo`. To use Bootstrapping from Go instead: `go get github.com/bootstrapping-engine/bootstrapping@latest`.
          NOTES
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "Bootstrapping $TAG" --notes-file ../notes.md $FILES
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $FILES
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
