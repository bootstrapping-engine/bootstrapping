name: test

# Every push to main and every pull request: formatting, vet, the full test
# suite (the story, random histories against the merge rules, applies
# killed halfway, eight processes on one file, the type affinity checked
# against SQLite, the command) on Linux, macOS and Windows, the same suite
# with PostgreSQL 13 and 18 and with MySQL 8.0 and 8.4 and MariaDB 10.6
# and 11.8, the race detector on Linux, the release plan's
# cases, and the smoke check on release-style binaries. A passing run on
# main starts the release workflow, which releases a raised version.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUILD_TAGS: sqlite_omit_load_extension,osusergo,netgo

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Tests
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test\.go:[0-9]+|panic:|^FAIL' test-output.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      # The race detector needs cgo; the rest is pure Go.
      - if: runner.os == 'Linux'
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: License texts of every compiled-in module
        run: bash scripts/third-party-licenses.sh > /dev/null
      - name: Release plan cases
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'
      - name: Smoke check on release-style binaries
        run: |
          mkdir bin
          for c in bootstrapping bst; do
            go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w" -o "bin/$c" "./cmd/$c"
          done
          go build -trimpath -tags "$BUILD_TAGS" -ldflags "-s -w" -o bin/bootstrapping-demo ./examples/permissions
          python3 -B scripts/smoke.py bin

  # The same suite with a PostgreSQL server: the tests that run on every
  # database (the story, both kinds of random history, the regressions, CSV
  # seeds, applies killed halfway, concurrent applies) run on it too, along
  # with PostgreSQL's own (types, settings, edits during an apply, the
  # command). The oldest and newest PostgreSQL versions supported.
  postgres:
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "18"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      CGO_ENABLED: "0"
      BS_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Tests
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m ./... 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test\.go:[0-9]+|panic:|^FAIL' test-output.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: The release-style binary against PostgreSQL
        run: |
          go build -trimpath -tags "$BUILD_TAGS" -ldflags '-s -w' -o bst ./cmd/bst
          psql "$BS_POSTGRES" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA smoke' \
            -c 'SET search_path = smoke' \
            -f <(sed 's/INTEGER PRIMARY KEY/BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY/' examples/permissions/schema.sql)
          db="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable&search_path=smoke"
          ./bst apply -db "$db" -seeds examples/permissions/seeds/v1 | tee out.txt
          grep -q 'Applied as run 1: 18 inserts.' out.txt
          ./bst status -db "$db" -seeds examples/permissions/seeds/v1 | grep -q 'In step with the seed'
          set +e; ./bst plan -db "$db" -seeds examples/permissions/seeds/v2 > /dev/null; code=$?; set -e
          test "$code" = 2

  # The same suite with MySQL or MariaDB: the tests that run on every
  # database run on it too, along with the MySQL tests of its own (types,
  # session settings, the apply lock, edits during an apply, reserved
  # names). The oldest and newest versions of each supported.
  mysql:
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.0", "mysql:8.4", "mariadb:10.6", "mariadb:11.8"]
    runs-on: ubuntu-latest
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
    env:
      CGO_ENABLED: "0"
      BS_MYSQL: mysql://root:root@127.0.0.1:3306/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Wait for the server
        run: |
          # The server's own client, run in its container: newer MariaDB
          # images name it mariadb only, and runners may not have one.
          c="${{ job.services.db.id }}"
          for i in $(seq 1 90); do
            cli=$(docker exec "$c" sh -c 'command -v mariadb || command -v mysql') &&
              docker exec "$c" "$cli" -uroot -proot -e 'SELECT VERSION()' 2>/dev/null &&
              echo "SQL=docker exec -i $c $cli -uroot -proot" >> "$GITHUB_ENV" && exit 0
            sleep 2
          done
          exit 1
      - name: Tests
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m ./... 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test\.go:[0-9]+|panic:|^FAIL' test-output.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: The release-style binary against MySQL
        run: |
          go build -trimpath -tags "$BUILD_TAGS" -ldflags '-s -w' -o bst ./cmd/bst
          $SQL -e 'CREATE DATABASE smoke'
          sed -e 's/INTEGER PRIMARY KEY/INTEGER NOT NULL AUTO_INCREMENT PRIMARY KEY/' -e 's/ TEXT/ VARCHAR(255)/' -e 's/ system / `system` /' \
            examples/permissions/schema.sql | $SQL smoke
          db="mysql://root:root@127.0.0.1:3306/smoke"
          ./bst apply -db "$db" -seeds examples/permissions/seeds/v1 | tee out.txt
          grep -q 'Applied as run 1: 18 inserts.' out.txt
          ./bst status -db "$db" -seeds examples/permissions/seeds/v1 | grep -q 'In step with the seed'
          set +e; ./bst plan -db "$db" -seeds examples/permissions/seeds/v2 > /dev/null; code=$?; set -e
          test "$code" = 2

  # Pure Go, so Windows needs no C compiler.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - run: go vet ./...
      - name: Tests
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test\.go:[0-9]+|panic:|^FAIL' test-output.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: Smoke check on release-style binaries
        run: |
          mkdir bin
          for c in bootstrapping bst; do
            go build -trimpath -tags "$BUILD_TAGS" -ldflags '-s -w' -o "bin/$c.exe" "./cmd/$c"
          done
          go build -trimpath -tags "$BUILD_TAGS" -ldflags '-s -w' -o bin/bootstrapping-demo.exe ./examples/permissions
          python -B scripts/smoke.py bin
